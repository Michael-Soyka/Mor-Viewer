[package]
name = "mor-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga"] }
lewton = "0.10"
morft = { version = "0.1.0", git = "https://github.com/Michael-Soyka/Mor-parser" }
morscene = { version = "0.1.0", git = "https://github.com/Michael-Soyka/Mor-parser", features = ["gltf"] }
mormesh = { version = "0.1.0", git = "https://github.com/Michael-Soyka/Mor-parser", features = ["gltf"] }
mortex = { version = "0.1.0", git = "https://github.com/Michael-Soyka/Mor-parser" }
morvfs = { version = "0.1.0", git = "https://github.com/Michael-Soyka/Mor-parser" }
rfd = "0.17.2"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
rodio = { version = "0.23", default-features = false, features = ["playback", "wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Until morvfs::read_entries is pushed to the Mor-parser repository.
[patch."https://github.com/Michael-Soyka/Mor-parser"]
morft    = { path = "../mor-parsers/crates/morft" }
mormesh  = { path = "../mor-parsers/crates/mormesh" }
morscene = { path = "../mor-parsers/crates/morscene" }
mortex   = { path = "../mor-parsers/crates/mortex" }
morvfs   = { path = "../mor-parsers/crates/morvfs" }

# Texture decoding is unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
